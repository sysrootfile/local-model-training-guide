# Aylik damga tazeligi turu: bayat (>=90 gun) sayfa varsa depoya issue acar/yorumlar.
# CI'daki `denetim` is akisi bayatligi kirmaz (QODER.md: bayat normal durumdur, eksik damga
# hatadir); bu is akisi HANDOFF "Sirdaki isler" maddesindeki takvimin ta kendisidir.
name: damga-takvimi

on:
  schedule:
    - cron: '0 9 1 * *' # her ayin 1'i, 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - id: rapor
        run: |
          set +e
          node scripts/dogrulama-kontrol.mjs --strict > damga-raporu.txt 2>&1
          kod=$?
          echo "cikis=$kod" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.rapor.outputs.cikis != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rapor = fs.readFileSync('damga-raporu.txt', 'utf8').slice(0, 55000);
            const baslik = 'Damga tazeliği: bayat sayfalar yeniden gözden geçirilmeli';
            const govde =
              'Aylık `dogrulama --strict` turu bayat sayfa buldu (damga-takvimi iş akışı):\n\n' +
              '```\n' + rapor + '\n```\n';
            const acik = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const eski = acik.find((i) => i.title === baslik && !i.pull_request);
            if (eski) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: eski.number,
                body: govde,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: baslik,
                body: govde,
              });
            }
